<article class="card event-card">
  <a class="card-link" href="{% url 'events:detail' event.public_id %}">
    <div class="card-media">
      {% if event.cover %}
        <img src="{% url 'events:cover' event.public_id %}" alt="" loading="lazy">
      {% else %}
        <div class="card-placeholder" aria-hidden="true">{{ event.title|slice:":1"|upper }}</div>
      {% endif %}
      <div class="date-chip">
        <span class="date-day">{{ event.starts_at|date:"j" }}</span>
        <span class="date-mon">{{ event.starts_at|date:"b" }}</span>
      </div>
    </div>
    <div class="card-body">
      <h3 class="card-title">{{ event.title }}</h3>
      <p class="card-meta">{{ event.starts_at|date:"l, H:i" }} · {{ event.author.name }}</p>
      {% if event.is_private %}<span class="tag tag-private">приватна</span>{% endif %}
    </div>
  </a>
</article>
